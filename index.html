<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MisZombies 1.11 Codex</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; font-family:'Courier New',monospace; touch-action:none; user-select:none; -webkit-user-select:none; }
canvas#c { position:fixed; top:0; left:0; display:block; }

/* HUD */
#hud { position:fixed; top:0; left:0; width:100%; pointer-events:none; z-index:10; display:flex; justify-content:center; gap:10px; padding:12px 16px; }
.hud-box { background:rgba(0,0,0,0.65); border:1px solid rgba(255,70,70,0.5); padding:5px 14px; border-radius:4px; color:#ff5050; font-size:12px; letter-spacing:2px; font-weight:bold; }
.hud-box span { color:#fff; font-size:17px; }
#hud .hud-kills { border-color:rgba(0,255,100,0.5); color:#00ff88; }
#hud .hud-ammo { border-color:rgba(255,220,80,0.55); color:#ffdd55; }

/* Crosshair */
#crosshair { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); pointer-events:none; z-index:10; }
#crosshair svg { filter:drop-shadow(0 0 4px rgba(255,255,255,0.8)); }

/* Hit X marker */
#hitx { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); pointer-events:none; z-index:20; opacity:0; transition:opacity 0.06s; }
#hitx svg { filter:drop-shadow(0 0 3px rgba(200,200,200,0.6)); }
#shootflash { position:fixed; inset:0; background:rgba(255,210,80,0.13); pointer-events:none; z-index:19; opacity:0; transition:opacity 0.05s; }
#reload-text { position:fixed; left:50%; bottom:86px; transform:translateX(-50%); z-index:30; color:#ffdd55; font-size:12px; letter-spacing:3px; font-family:'Courier New',monospace; text-shadow:0 0 10px #000; opacity:0; pointer-events:none; transition:opacity .12s; }
#reload-text.open { opacity:1; }

#pause-btn { position:fixed; top:calc(12px + env(safe-area-inset-top)); left:16px; z-index:50; background:rgba(0,0,0,0.7); border:1px solid rgba(255,220,80,0.55); color:#ffdd55; font-size:18px; width:44px; height:44px; border-radius:6px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
#pause-btn:active { background:rgba(255,220,80,0.22); }

/* Settings panel */
#settings-panel { position:fixed; inset:0; z-index:520; background:rgba(0,0,0,0.95); display:none; flex-direction:column; align-items:center; justify-content:flex-start; padding:20px; overflow-y:auto; }
#settings-panel.open { display:flex; }
#settings-panel h2 { color:#ff5050; font-size:20px; letter-spacing:4px; margin:14px 0 20px; text-align:center; border-bottom:1px solid rgba(255,70,70,0.3); padding-bottom:10px; width:100%; max-width:420px; }
.srow { width:100%; max-width:420px; margin-bottom:16px; }
.srow label { color:#aaa; font-size:10px; letter-spacing:2px; text-transform:uppercase; display:flex; justify-content:space-between; margin-bottom:7px; }
.srow label span { color:#ff5050; font-size:13px; }
.srow input[type=range] { width:100%; height:6px; -webkit-appearance:none; appearance:none; background:rgba(255,70,70,0.2); border-radius:3px; outline:none; }
.srow input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:22px; height:22px; background:#ff5050; border-radius:50%; cursor:pointer; box-shadow:0 0 8px #ff5050; }
.toggle-row { width:100%; max-width:420px; margin-bottom:13px; display:flex; align-items:center; justify-content:space-between; color:#aaa; font-size:10px; letter-spacing:2px; text-transform:uppercase; }
.toggle-row input { width:24px; height:24px; accent-color:#ff5050; }
.ssep { color:#444; font-size:9px; letter-spacing:3px; text-transform:uppercase; width:100%; max-width:420px; margin:2px 0 12px; padding-top:10px; border-top:1px solid rgba(255,255,255,0.06); }
#close-btn { margin:16px 0 8px; background:rgba(255,70,70,0.15); border:1px solid rgba(255,70,70,0.55); color:#ff5050; padding:13px 44px; border-radius:6px; font-family:'Courier New',monospace; font-size:12px; letter-spacing:3px; cursor:pointer; }
#close-btn:active { background:rgba(255,70,70,0.35); }

/* ── DRAGGABLE BUTTONS ─────────────────────────── */
.game-btn {
  position:fixed; z-index:15;
  display:flex; align-items:center; justify-content:center;
  border-radius:50%; cursor:pointer;
  touch-action:none;
  /* default size set via JS */
}
.game-btn .btn-icon { pointer-events:none; }
.game-btn .resize-handle {
  position:absolute; bottom:2px; right:2px;
  width:14px; height:14px;
  background:rgba(255,255,255,0.25);
  border-radius:50%;
  cursor:se-resize;
  display:none; /* shown only in edit-layout mode */
  align-items:center; justify-content:center;
  font-size:9px; color:#fff;
  z-index:2;
}

/* Fire button */
/* Reload button */
#reload-btn {
  background:rgba(255,220,60,0.18);
  border:2.5px solid rgba(255,220,60,0.65);
  box-shadow:0 0 14px rgba(255,220,60,0.2);
  color:#ffdd55;
  font-size:22px;
}
#reload-btn.active { background:rgba(255,220,60,0.42); box-shadow:0 0 26px rgba(255,220,60,0.55); }
#reload-btn.empty  { border-color:rgba(255,80,80,0.8); color:#ff5050; animation:blinkRed 0.4s infinite alternate; }
@keyframes blinkRed { from{opacity:1} to{opacity:0.4} }

/* Ammo shop prompt */
#ammo-shop {
  position:fixed; left:50%; bottom:150px; transform:translateX(-50%);
  z-index:30; display:none; flex-direction:column; align-items:center; gap:6px;
  pointer-events:auto;
}
#ammo-shop.visible { display:flex; }
.shop-label {
  color:#ffe066; font-family:'Courier New',monospace; font-size:11px;
  letter-spacing:3px; text-shadow:0 0 8px #000; background:rgba(0,0,0,0.6);
  padding:4px 12px; border-radius:4px; border:1px solid rgba(255,220,60,0.4);
}
#buy-ammo-btn {
  background:rgba(255,200,0,0.22); border:2px solid rgba(255,220,60,0.75);
  color:#ffe066; font-family:'Courier New',monospace; font-size:13px;
  letter-spacing:2px; padding:10px 24px; border-radius:6px;
  cursor:pointer; box-shadow:0 0 16px rgba(255,200,0,0.25);
}
#buy-ammo-btn:active { background:rgba(255,200,0,0.45); }

/* Ammo box markers on minimap (decorative) */
.ammo-box-marker { display:none; }

#fire-btn {
  background:rgba(255,50,50,0.2);
  border:2.5px solid rgba(255,80,80,0.6);
  box-shadow:0 0 18px rgba(255,50,50,0.25);
  color:#ff5050;
  font-size:30px;
}
#fire-btn.firing { background:rgba(255,50,50,0.5); box-shadow:0 0 30px rgba(255,80,80,0.6); }
#aim-btn {
  background:rgba(255,220,70,0.16);
  border:2.5px solid rgba(255,220,80,0.62);
  box-shadow:0 0 18px rgba(255,220,80,0.18);
  color:#ffdd55;
  font-size:16px;
  font-weight:bold;
  letter-spacing:1px;
}
#aim-btn.aiming { background:rgba(255,220,70,0.42); box-shadow:0 0 26px rgba(255,220,80,0.52); }

/* Joystick */
#joystick-base {
  position:fixed; z-index:15;
  border-radius:50%;
  background:rgba(255,255,255,0.06);
  border:2px solid rgba(255,255,255,0.15);
  pointer-events:none;
  display:none; /* shown when joystick active */
}
#joystick-knob {
  position:fixed; z-index:16;
  border-radius:50%;
  background:rgba(255,255,255,0.22);
  border:2px solid rgba(255,255,255,0.5);
  pointer-events:none;
  display:none;
}

/* Move zone indicator (left side, invisible) */
#move-zone { position:fixed; top:0; left:0; z-index:5; background:transparent; }
/* Look zone (right side, invisible) */
#look-zone { position:fixed; top:0; right:0; z-index:5; background:transparent; }

/* Edit-layout overlay — purely visual, never captures pointer events */
#edit-overlay {
  position:fixed; inset:0; z-index:14;
  background:rgba(0,0,30,0.55);
  display:none;
  pointer-events:none;
}
#edit-overlay.open { display:block; }
#edit-hint {
  position:absolute; top:42%; left:50%; transform:translate(-50%,-50%);
  color:rgba(255,255,255,0.5); font-size:13px; letter-spacing:2px; text-align:center;
  pointer-events:none; line-height:2;
}
#edit-done {
  position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
  z-index:300; background:rgba(0,180,90,0.25); border:1px solid rgba(0,255,130,0.7);
  color:#00ff88; padding:14px 36px; border-radius:8px;
  font-family:'Courier New',monospace; font-size:12px; letter-spacing:3px; cursor:pointer;
  display:none; pointer-events:auto;
}
#edit-done.open { display:block; }

/* Edit layout btn inside settings */
#edit-layout-btn { width:100%; max-width:420px; margin-bottom:10px; background:rgba(80,80,255,0.12); border:1px solid rgba(100,100,255,0.45); color:#8888ff; padding:11px 0; border-radius:6px; font-family:'Courier New',monospace; font-size:11px; letter-spacing:2px; cursor:pointer; }
#edit-layout-btn:active { background:rgba(80,80,255,0.3); }

/* Score popup — yellow damage numbers */
.spop { position:fixed; z-index:25; color:#ffe500; font-weight:bold; font-size:18px; font-family:'Courier New',monospace; letter-spacing:1px; pointer-events:none; text-shadow:0 0 10px #ffcc00, 0 0 4px #000; animation:popUp 0.85s ease-out forwards; }
@keyframes popUp { 0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-65px) scale(1.3)} }

/* ── HEALTH BAR ── */
#health-bar-wrap {
  position:fixed; bottom:38px; left:50%; transform:translateX(-50%);
  z-index:11; pointer-events:none;
  display:flex; flex-direction:column; align-items:center; gap:3px;
}
#health-label { color:#aaa; font-size:9px; letter-spacing:3px; font-family:'Courier New',monospace; }
#health-bar-bg {
  width:220px; height:14px;
  background:rgba(0,0,0,0.6); border:1px solid rgba(255,60,60,0.4);
  border-radius:7px; overflow:hidden;
}
#health-bar-fill {
  height:100%; width:100%;
  background:linear-gradient(90deg,#cc0000,#ff4444);
  border-radius:7px;
  transition: width 0.15s ease, background 0.3s;
}
#health-bar-fill.low  { background:linear-gradient(90deg,#880000,#cc2222); }
#health-bar-fill.crit { background:linear-gradient(90deg,#440000,#880000); animation:hpPulse 0.5s infinite alternate; }
@keyframes hpPulse { from{opacity:1} to{opacity:0.45} }
#health-text { color:#ff5050; font-size:11px; letter-spacing:2px; font-family:'Courier New',monospace; font-weight:bold; }

/* Damage flash */
#dmgflash { position:fixed; inset:0; pointer-events:none; z-index:22; opacity:0;
  background:radial-gradient(ellipse at center, transparent 30%, rgba(200,0,0,0.55) 100%);
  transition:opacity 0.05s; }
#pause-overlay { position:fixed; inset:0; z-index:450; display:none; align-items:center; justify-content:center; flex-direction:column; gap:18px; background:rgba(0,0,0,0.78); color:#ffdd55; font-family:'Courier New',monospace; letter-spacing:4px; text-align:center; pointer-events:auto; }
#pause-overlay.open { display:flex; }
#pause-overlay .pause-title { font-size:38px; font-weight:bold; text-shadow:0 0 22px rgba(255,220,85,0.45); }
#pause-overlay button { min-width:190px; padding:13px 34px; background:rgba(255,220,80,0.14); border:1px solid rgba(255,220,80,0.65); color:#ffdd55; border-radius:6px; font-family:'Courier New',monospace; letter-spacing:3px; }

/* Stats bar */
#stats { position:fixed; bottom:0; left:0; width:100%; background:rgba(0,0,0,0.65); border-top:1px solid rgba(255,70,70,0.2); display:flex; justify-content:space-around; padding:6px 0; z-index:10; pointer-events:none; }
.st { text-align:center; }
.st-l { color:#444; font-size:8px; letter-spacing:2px; text-transform:uppercase; }
.st-v { color:#ff5050; font-size:15px; font-weight:bold; }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════
   PROCEDURAL TEXTURES
═══════════════════════════════════════════════════════════ */
function makeTex(size, fn) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  fn(cv.getContext('2d'), size);
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

const floorTex = makeTex(256, (ctx, S) => {
  ctx.fillStyle = '#181822'; ctx.fillRect(0,0,S,S);
  const ts = S/4;
  for(let r=0;r<4;r++) for(let c=0;c<4;c++) {
    ctx.fillStyle=(r+c)%2===0?'#1c1c28':'#161620';
    ctx.fillRect(c*ts+1,r*ts+1,ts-2,ts-2);
  }
  ctx.strokeStyle='#2a2a3e'; ctx.lineWidth=1;
  for(let i=0;i<=S;i+=ts){ ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,S);ctx.stroke(); ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(S,i);ctx.stroke(); }
  for(let i=0;i<600;i++){const v=20+Math.random()*15;ctx.fillStyle=`rgba(${v},${v},${v+10},0.3)`;ctx.fillRect(Math.random()*S,Math.random()*S,2,2);}
});
floorTex.repeat.set(10,10);

const wallTex = makeTex(256, (ctx,S) => {
  ctx.fillStyle='#12121e'; ctx.fillRect(0,0,S,S);
  const bw=64,bh=30;
  for(let row=0;row*bh<S+bh;row++){
    const ox=(row%2)*(bw/2);
    for(let col=-1;col*bw<S+bw;col++){
      const l=10+Math.random()*5; ctx.fillStyle=`hsl(240,8%,${l}%)`;
      ctx.fillRect(col*bw+ox+1,row*bh+1,bw-2,bh-2);
    }
  }
  ctx.strokeStyle='#0a0a14'; ctx.lineWidth=2;
  for(let row=0;row*bh<S+bh;row++){const ox=(row%2)*(bw/2);for(let col=-1;col*bw<S+bw;col++)ctx.strokeRect(col*bw+ox+1,row*bh+1,bw-2,bh-2);}
});
wallTex.repeat.set(5,2);

const ceilTex = makeTex(128,(ctx,S)=>{
  ctx.fillStyle='#0e0e18';ctx.fillRect(0,0,S,S);
  ctx.strokeStyle='#1a1a28';ctx.lineWidth=2;
  for(let i=0;i<=S;i+=S/4){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,S);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(S,i);ctx.stroke();}
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){ctx.fillStyle='#22223a';ctx.fillRect(c*(S/4)+(S/8)-3,r*(S/4)+(S/8)-3,6,6);}
});
ceilTex.repeat.set(6,6);

const sphereTex = makeTex(256,(ctx,S)=>{
  const bg=ctx.createRadialGradient(S*.38,S*.35,4,S/2,S/2,S/2);
  bg.addColorStop(0,'#ff8888');bg.addColorStop(.3,'#ff2222');bg.addColorStop(.65,'#bb0000');bg.addColorStop(1,'#440000');
  ctx.fillStyle=bg;ctx.beginPath();ctx.arc(S/2,S/2,S/2-1,0,Math.PI*2);ctx.fill();
  const sg=ctx.createRadialGradient(S*.35,S*.3,1,S*.38,S*.33,S*.2);
  sg.addColorStop(0,'rgba(255,255,255,0.9)');sg.addColorStop(.5,'rgba(255,255,255,0.3)');sg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=sg;ctx.beginPath();ctx.arc(S*.38,S*.33,S*.2,0,Math.PI*2);ctx.fill();
  const eg=ctx.createRadialGradient(S/2,S/2,S*.35,S/2,S/2,S/2);
  eg.addColorStop(0,'rgba(0,0,0,0)');eg.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle=eg;ctx.beginPath();ctx.arc(S/2,S/2,S/2-1,0,Math.PI*2);ctx.fill();
});

/* ═══════════════════════════════════════════════════════════
   THREE.JS SCENE
═══════════════════════════════════════════════════════════ */
const W = window.innerWidth, H = window.innerHeight;
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(W,H);
renderer.setClearColor(0x090910,1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
function applyRenderQuality(){
  const low = cfg && cfg.performanceMode;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, low ? 1 : 2));
  scene.fog = new THREE.Fog(0x020204, 8, low ? 18 : 28);
  // In performance mode: disable shadow maps entirely (big GPU saving)
  renderer.shadowMap.enabled = !low;
  flashlight.castShadow = !low;
}

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x090910,10,40);

const BASE_FOV = 72;
const ADS_ZOOM = 1.4;
const ADS_FOV = BASE_FOV / ADS_ZOOM;
const camera = new THREE.PerspectiveCamera(BASE_FOV, W/H, 0.05, 100);

const collisionWalls = [];

const WT = 0.4;

function addWall(cx, cz, len, axis, mat, height){
  const h  = height || CEIL;
  const hw = axis==='x' ? len/2 : WT/2;
  const hd = axis==='x' ? WT/2  : len/2;
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(hw*2, h, hd*2), mat||wMat);
  mesh.position.set(cx, h/2, cz);
  mesh.receiveShadow=true;
  mesh.castShadow=true;
  scene.add(mesh);
  wallMeshes.push(mesh);
  collisionWalls.push({ x0:cx-hw, x1:cx+hw, z0:cz-hd, z1:cz+hd });
}

function addBarrier(cx,cz,w,d,mat){
  const h = 1.1;
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat||wMat2);
  mesh.position.set(cx, h/2, cz);
  mesh.receiveShadow=true;
  mesh.castShadow=true;
  scene.add(mesh);
  wallMeshes.push(mesh);
  collisionWalls.push({ x0:cx-w/2, x1:cx+w/2, z0:cz-d/2, z1:cz+d/2 });
}

// ── FLASHLIGHT SYSTEM ─────────────────────────────────────
// SpotLights are children of the camera (move with player).
// Their targets live in the SCENE and are updated every frame
// using camera.getWorldDirection() so they always point where
// the player looks, regardless of camera rotation.

// 1. Core beam — tight, bright, long-range. Only this one casts shadows.

flashlight.shadow.bias = -0.002;          // prevent shadow acne on walls/floor
camera.add(flashlight);

const flashlightTarget = new THREE.Object3D();
scene.add(flashlightTarget);
flashlight.target = flashlightTarget;

flashNear.castShadow = false;
flashNear.position.set(0, 0, -1.0);
camera.add(flashNear);

// Helper: updated every frame in animate()
const _flashDir = new THREE.Vector3();
const _flashPos = new THREE.Vector3();
function updateFlashlightTargets(){
  camera.getWorldDirection(_flashDir);
  camera.getWorldPosition(_flashPos);
  // Place target 20 units ahead in the look direction
  flashlightTarget.position.copy(_flashPos).addScaledVector(_flashDir, 20);
  flashHaloTarget.position.copy(_flashPos).addScaledVector(_flashDir, 20);
}

function buildMannequin(){
  const group = new THREE.Group();

  /*
    Skeleton (y=0 = floor, all in group-local space)
    ─────────────────────────────────────────────────
    Head top   ≈ 1.88
    Head ctr       1.73
    Neck           1.53
    Shoulder    1.45  (arm pivot here)
    Torso ctr   1.24  (y=0.98..1.50)
    Hips ctr    0.89
    Hip pivot   0.82  (leg pivot here)
    Knee        0.82 - 0.42 = 0.40
    Ankle       0.40 - 0.40 = 0.00  ← floor
  */

  // ── Torso ──
  const torso = new THREE.Mesh(
    new THREE.BoxGeometry(0.42, 0.52, 0.22), mBodyMat);
  torso.position.set(0, 1.24, 0);
  group.add(torso);

  // Chest target decal
  const chest = new THREE.Mesh(
    new THREE.BoxGeometry(0.30, 0.30, 0.01),
    new THREE.MeshPhongMaterial({map:maniBodyTex, transparent:true, opacity:0.9}));
  chest.position.set(0, 1.28, 0.115);
  group.add(chest);

  // ── Hips ──
  const hips = new THREE.Mesh(
    new THREE.BoxGeometry(0.40, 0.18, 0.20), mBodyMat);
  hips.position.set(0, 0.89, 0);
  group.add(hips);

  // ── Neck ──
  const neck = new THREE.Mesh(
    new THREE.CylinderGeometry(0.07, 0.08, 0.10, 8), mLimbMat);
  neck.position.set(0, 1.53, 0);
  group.add(neck);

  // ── Head ──
  const head = new THREE.Mesh(
    new THREE.BoxGeometry(0.28, 0.30, 0.24), mHeadMat);
  head.position.set(0, 1.73, 0);
  group.add(head);

  // ── Arms — pivot at shoulder (y=1.45) ──
  const armL = new THREE.Group(); armL.position.set( 0.28, 1.45, 0); group.add(armL);
  const armR = new THREE.Group(); armR.position.set(-0.28, 1.45, 0); group.add(armR);

  const uArmGeo = new THREE.CylinderGeometry(0.065, 0.060, 0.32, 8);
  const lArmGeo = new THREE.CylinderGeometry(0.055, 0.050, 0.28, 8);

  // Upper arms hang down from shoulder pivot — mesh center at -0.16
  const uArmL = new THREE.Mesh(uArmGeo, mLimbMat); uArmL.position.y = -0.16; armL.add(uArmL);
  const uArmR = new THREE.Mesh(uArmGeo, mLimbMat); uArmR.position.y = -0.16; armR.add(uArmR);

  // Elbow pivots at y=-0.32 (bottom of upper arm)
  const elbowL = new THREE.Group(); elbowL.position.y = -0.32; armL.add(elbowL);
  const elbowR = new THREE.Group(); elbowR.position.y = -0.32; armR.add(elbowR);

  const lArmLm = new THREE.Mesh(lArmGeo, mLimbMat); lArmLm.position.y = -0.14; elbowL.add(lArmLm);
  const lArmRm = new THREE.Mesh(lArmGeo, mLimbMat); lArmRm.position.y = -0.14; elbowR.add(lArmRm);

  const handGeo = new THREE.SphereGeometry(0.055, 7, 5);
  const handL = new THREE.Mesh(handGeo, mJointMat); handL.position.y = -0.28; elbowL.add(handL);
  const handR = new THREE.Mesh(handGeo, mJointMat); handR.position.y = -0.28; elbowR.add(handR);

  // ── Legs — built in a temporary group, rotated 180° on Y, then added ──
  // Building them rotated means rotation.x on knee now bends FORWARD correctly.
  const uLegGeo = new THREE.CylinderGeometry(0.085, 0.075, 0.42, 8);
  const lLegGeo = new THREE.CylinderGeometry(0.070, 0.060, 0.40, 8);
  const footGeo = new THREE.BoxGeometry(0.10, 0.06, 0.22);

  function buildLeg(side){ // side: +1 = left, -1 = right
    // Wrapper rotated 180° around Y — inverts local Z so knee bends forward
    const wrapper = new THREE.Group();
    wrapper.rotation.y = Math.PI;
    wrapper.position.set(side * 0.12, 0.82, 0);

    const legPivot = new THREE.Group(); // hip pivot at y=0 within wrapper
    wrapper.add(legPivot);

    const uLegM = new THREE.Mesh(uLegGeo, mLimbMat);
    uLegM.position.y = -0.21;
    legPivot.add(uLegM);

    const kneePivot = new THREE.Group();
    kneePivot.position.y = -0.42;
    legPivot.add(kneePivot);

    const lLegM = new THREE.Mesh(lLegGeo, mLimbMat);
    lLegM.position.y = -0.20;
    kneePivot.add(lLegM);

    const foot = new THREE.Mesh(footGeo, mLimbMat);
    foot.position.set(0, -0.40, 0.08);
    kneePivot.add(foot);

    // Joint spheres
    [legPivot, kneePivot].forEach(g => {
      const js = new THREE.Mesh(new THREE.SphereGeometry(0.07, 6, 5), mJointMat);
      g.add(js);
    });

    // Hit tags
    uLegM.userData.bodyPart = 'limb';
    lLegM.userData.bodyPart = 'limb';
    foot.userData.bodyPart  = 'limb';

    group.add(wrapper);
    return { wrapper, legPivot, kneePivot, uLegM, lLegM, foot };
  }

  const legLData = buildLeg( 1); // left
  const legRData = buildLeg(-1); // right
  const legL = legLData.legPivot;
  const legR = legRData.legPivot;
  const kneeL = legLData.kneePivot;
  const kneeR = legRData.kneePivot;

  // Joint spheres for arms
  [armL, armR, elbowL, elbowR].forEach(g => {
    const js = new THREE.Mesh(new THREE.SphereGeometry(0.07, 6, 5), mJointMat);
    g.add(js);

function resolveCollisions(pos) {
  // Hard outer boundary (slightly inside the perimeter wall centres)
  if(pos.x >  WALL_LIMIT) pos.x =  WALL_LIMIT;
  if(pos.x < -WALL_LIMIT) pos.x = -WALL_LIMIT;
  if(pos.z >  WALL_LIMIT) pos.z =  WALL_LIMIT;
  if(pos.z < -WALL_LIMIT) pos.z = -WALL_LIMIT;

  // Interior walls — 2 passes to handle corners correctly
  for(let pass=0; pass<2; pass++){
    for(const w of collisionWalls){
      const wx=(w.x0+w.x1)/2, wz=(w.z0+w.z1)/2;
      const hw=(w.x1-w.x0)/2 + PLAYER_R;
      const hd=(w.z1-w.z0)/2 + PLAYER_R;
      const dx=pos.x-wx, dz=pos.z-wz;
      const adx=Math.abs(dx), adz=Math.abs(dz);
      if(adx<hw && adz<hd){
        const penX=hw-adx, penZ=hd-adz;
        if(penX < penZ) pos.x = wx + Math.sign(dx)*hw;
        else            pos.z = wz + Math.sign(dz)*hd;
      }
    }
  }
}

}

const NOTE={A2:110,C3:130.81,D3:146.83,E3:164.81,G3:196,A3:220,C4:261.63,D4:293.66,E4:329.63,G4:392,A4:440,C5:523.25,E5:659.25,G5:783.99};
const MELODY=[NOTE.A3,NOTE.C4,NOTE.E4,NOTE.G4,NOTE.A4,NOTE.G4,NOTE.E4,NOTE.C4,NOTE.D4,NOTE.E4,NOTE.G4,NOTE.A4,NOTE.G4,NOTE.E4,NOTE.D4,NOTE.C4,NOTE.A3,NOTE.C4,NOTE.E4,NOTE.G4,NOTE.A4,NOTE.C5,NOTE.A4,NOTE.G4,NOTE.E4,NOTE.D4,NOTE.E4,NOTE.G4,NOTE.A4,NOTE.G4,NOTE.E4,NOTE.A3];
const BASS=[NOTE.A2,NOTE.A2,NOTE.E3,NOTE.A2,NOTE.C3,NOTE.C3,NOTE.G3,NOTE.C3,NOTE.D3,NOTE.D3,NOTE.A3,NOTE.D3,NOTE.A2,NOTE.A2,NOTE.E3,NOTE.A2];
const BPM=128,BEAT=60/BPM,STEP=BEAT/2,BAR=BEAT*4;
let musicStarted=false,musicRunning=false,melStep=0,bassStep=0,hatStep=0,nextBeat=0,nextHat=0;

function makeOsc(type,freq,gainVal,duration,startTime,dest){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(.001,startTime);g.gain.linearRampToValueAtTime(gainVal,startTime+.01);g.gain.exponentialRampToValueAtTime(.001,startTime+duration);
  o.connect(g);g.connect(dest);o.start(startTime);o.stop(startTime+duration+.02);
}
function playPad(t){
  const chords=[[NOTE.A2,NOTE.C3,NOTE.E3,NOTE.G3],[NOTE.C3,NOTE.E3,NOTE.G3,NOTE.A3],[NOTE.D3,174.61,NOTE.A3,NOTE.C4],[NOTE.A2,NOTE.C3,NOTE.E3,NOTE.G3]];
  const chord=chords[Math.floor((t/(BAR*4))%chords.length)|0];
  chord.forEach(freq=>{
    const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=freq;o.detune.value=(Math.random()-.5)*8;
    const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;lp.Q.value=1.2;
    const g=AC.createGain();g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.07,t+.4);g.gain.setValueAtTime(.07,t+BAR*2-.4);g.gain.linearRampToValueAtTime(.001,t+BAR*2);
    o.connect(lp);lp.connect(g);g.connect(reverbWet);g.connect(reverbDry);o.start(t);o.stop(t+BAR*2+.1);
  });
}
function scheduleMusicStep(){
  if(!musicRunning)return;
  const t=AC.currentTime,LA=0.18;
  while(nextBeat<t+LA){
    const freq=MELODY[melStep%MELODY.length];
    makeOsc('sawtooth',freq,.11,STEP*.75,nextBeat,reverbDry);
    makeOsc('square',freq*2,.03,STEP*.4,nextBeat,reverbWet);
    melStep++;
    if(melStep%4===0){const bf=BASS[bassStep%BASS.length];makeOsc('sawtooth',bf,.22,BEAT*.9,nextBeat,reverbDry);makeOsc('sine',bf,.18,BEAT*.85,nextBeat,musicGain);bassStep++;}
    if(melStep%MELODY.length===0)playPad(nextBeat);
    nextBeat+=STEP;
  }
  while(nextHat<t+LA){
    const isDown=hatStep%4===0,isUp=hatStep%2===0;
    const vol=isDown?.18:isUp?.1:.05,dur=isDown?.04:.025;
    const hB=AC.createBuffer(1,AC.sampleRate*dur,AC.sampleRate);const hd=hB.getChannelData(0);for(let i=0;i<hd.length;i++)hd[i]=Math.random()*2-1;
    const hS=AC.createBufferSource();hS.buffer=hB;const hHp=AC.createBiquadFilter();hHp.type='highpass';hHp.frequency.value=7000;
    const hG=AC.createGain();hG.gain.setValueAtTime(vol,nextHat);hG.gain.exponentialRampToValueAtTime(.001,nextHat+dur);
    hS.connect(hHp);hHp.connect(hG);hG.connect(musicGain);hS.start(nextHat);hS.stop(nextHat+dur+.01);
    if(hatStep%8===0||hatStep%8===4){const ko=AC.createOscillator();ko.type='sine';ko.frequency.setValueAtTime(180,nextHat);ko.frequency.exponentialRampToValueAtTime(40,nextHat+.12);const kg=AC.createGain();kg.gain.setValueAtTime(.55,nextHat);kg.gain.exponentialRampToValueAtTime(.001,nextHat+.14);ko.connect(kg);kg.connect(musicGain);ko.start(nextHat);ko.stop(nextHat+.15);}
    if(hatStep%8===2||hatStep%8===6){const snB=AC.createBuffer(1,AC.sampleRate*.09,AC.sampleRate);const snd=snB.getChannelData(0);for(let i=0;i<snd.length;i++)snd[i]=Math.random()*2-1;const snS=AC.createBufferSource();snS.buffer=snB;const snBp=AC.createBiquadFilter();snBp.type='bandpass';snBp.frequency.value=2200;snBp.Q.value=.9;const snG=AC.createGain();snG.gain.setValueAtTime(.28,nextHat);snG.gain.exponentialRampToValueAtTime(.001,nextHat+.09);snS.connect(snBp);snBp.connect(snG);snG.connect(musicGain);const sto=AC.createOscillator();sto.type='triangle';sto.frequency.value=220;const stg=AC.createGain();stg.gain.setValueAtTime(.18,nextHat);stg.gain.exponentialRampToValueAtTime(.001,nextHat+.07);sto.connect(stg);stg.connect(musicGain);snS.start(nextHat);snS.stop(nextHat+.1);sto.start(nextHat);sto.stop(nextHat+.08);}
    hatStep++;nextHat+=BEAT/4;
  }
  setTimeout(scheduleMusicStep,80);
}
function startMusic(){
  if(musicStarted)return;musicStarted=true;musicRunning=true;
  if(AC.state==='suspended')AC.resume();
  nextBeat=AC.currentTime+.1;nextHat=AC.currentTime+.1;

// Make a button draggable & resizable
function makeDraggable(btnId, cfgKey) {
  const el = document.getElementById(btnId);
  const handle = el.querySelector('.resize-handle');
  let dragging = false, resizing = false;
  let activeTouchId = null;
  let startTX=0, startTY=0, startX=0, startY=0, startSize=0;

  function onDragStart(clientX, clientY, isHandle) {
    if (isHandle) {
      resizing = true;
      startTX = clientX; startTY = clientY;
      startSize = btnCfg[cfgKey].size;
    } else {
      dragging = true;
      startTX = clientX; startTY = clientY;
      startX = btnCfg[cfgKey].x; startY = btnCfg[cfgKey].y;
    }
  }
  function onDragMove(clientX, clientY) {
    if (dragging) {
      btnCfg[cfgKey].x = Math.max(0, Math.min(window.innerWidth  - btnCfg[cfgKey].size, startX + (clientX - startTX)));
      btnCfg[cfgKey].y = Math.max(0, Math.min(window.innerHeight - btnCfg[cfgKey].size, startY + (clientY - startTY)));
      applyBtnCfg();
    }
    if (resizing) {
      const delta = (clientX - startTX + clientY - startTY) * 0.5;
      btnCfg[cfgKey].size = Math.max(44, Math.min(160, startSize + delta));
      applyBtnCfg();
    }
  }
  function onDragEnd() { dragging = false; resizing = false; activeTouchId = null; }

  // Touch
  el.addEventListener('touchstart', e => {
    if (!editMode) return;
    const t = e.changedTouches[0];
    if (activeTouchId !== null) return;
    activeTouchId = t.identifier;
    const hRect = handle.getBoundingClientRect();
    const onHandle = (t.clientX>=hRect.left && t.clientX<=hRect.right && t.clientY>=hRect.top && t.clientY<=hRect.bottom);
    onDragStart(t.clientX, t.clientY, onHandle);
    e.preventDefault(); e.stopPropagation();
  }, { passive: false });

  document.addEventListener('touchmove', e => {
    if (!editMode || activeTouchId === null) return;
    for (const t of e.changedTouches) {
      if (t.identifier === activeTouchId) { onDragMove(t.clientX, t.clientY); break; }
    }
    e.preventDefault();
  }, { passive: false });

  document.addEventListener('touchend', e => {
    for (const t of e.changedTouches) {
      if (t.identifier === activeTouchId) { onDragEnd(); break; }
    }
  }, { passive: true });

  // Mouse
  el.addEventListener('mousedown', e => {
    if (!editMode) return;
    const hRect = handle.getBoundingClientRect();
    const onHandle = (e.clientX>=hRect.left && e.clientX<=hRect.right && e.clientY>=hRect.top && e.clientY<=hRect.bottom);
    onDragStart(e.clientX, e.clientY, onHandle);
    e.preventDefault(); e.stopPropagation();
  });
  document.addEventListener('mousemove', e => { if (!editMode) return; onDragMove(e.clientX, e.clientY); });
  document.addEventListener('mouseup', () => onDragEnd());
}

moveZone.addEventListener('touchstart', e=>{
  if(editMode||gamePaused) return;
  const t=e.changedTouches[0];
  if(mvId===null){

    const ks=JR*0.48;
    jBase.style.cssText=`position:fixed;left:${mvBX-JR}px;top:${mvBY-JR}px;width:${JR*2}px;height:${JR*2}px;z-index:15;border-radius:50%;background:rgba(255,255,255,0.06);border:2px solid rgba(255,255,255,0.15);display:block;pointer-events:none;`;

// Points per zone (same values as damage so every hit is worth points)
const DAMAGE = { head: 100, torso: 34, limb: 20 };
// Kill bonus multiplier: killing a bot awards 2× the finishing shot's value
const SCORE_VALUE = { head: 25, torso: 10, limb: 5 };
const KILL_BONUS = 15;

function updateAmmoUI(){

  if(isReloading || ammo === MAG_SIZE || playerDead) return;
  stopFireHold();
  setAiming(false);
  isReloading = true;

    ammo = MAG_SIZE;

}

function shoot(){
  if(!canShoot||editMode||playerDead||gamePaused||isReloading)return;
  if(ammo <= 0){ reloadWeapon(); return; }
  canShoot=false; setTimeout(()=>canShoot=true, FIRE_DELAY);
  ammo--; updateAmmoUI();
  unlockAudio(); playShoot();
  totalShots++; fireBullet();
  recoilKick = RECOIL_KICK;
  recoilRot  = RECOIL_ROT;
  muzzle.intensity=4; setTimeout(()=>muzzle.intensity=0, 80);
  sf.style.opacity='1'; setTimeout(()=>sf.style.opacity='0', 55);

  raycaster.setFromCamera({x:0,y:0}, camera);

  // Cast against BOTH bots and walls in one call so we get true depth order
  const allTargets = [...getAllTargetMeshes(), ...wallMeshes];
  const hits3 = raycaster.intersectObjects(allTargets, false);

  if(hits3.length){
    const nearest = hits3[0].object;
    // Only register a hit if the nearest object belongs to a bot (not a wall)
    const mani = getMannequinFromMesh(nearest);
    if(mani){
      const part = nearest.userData.bodyPart || 'limb';
      const dmg  = DAMAGE[part] || 20;
      mani.health -= dmg;
      mani.damageAccum = (mani.damageAccum || 0) + dmg;

      totalHits++;
      streak++;
      hf.style.opacity='1'; setTimeout(()=>hf.style.opacity='0', 120);
      playHit();

      // Points earned this shot (damage value × streak bonus)
      const streakBonus = Math.min(3, Math.floor(streak / 7)); // slower score scaling
      const ptsEarned = (SCORE_VALUE[part] || 5) + streakBonus * 2;

      if(mani.health <= 0 && !mani.dying){
        kills++;
        const killPts = ptsEarned + KILL_BONUS;
        score += killPts;
        // Trigger death animation — respawn happens after animation ends
        mani.dying    = true;
        mani.deathTimer = 0;
        mani.deathFrozen = false;
        mani.deathType  = (part === 'head') ? 'head' : 'body';
        mani.deathVariant = Math.floor(Math.random()*3); // 0,1,2
        mani.vel.set(0,0,0); // stop moving
        popupKill(killPts, part);
      } else {
        score += ptsEarned;
        popup(ptsEarned, part);
      }
    }
  } else { streak=0; }

  document.getElementById('score').textContent=score;
  document.getElementById('kills').textContent=kills;
  document.getElementById('s-hits').textContent=totalHits;
  document.getElementById('s-shots').textContent=totalShots;
  document.getElementById('s-acc').textContent=totalShots>0?Math.round(totalHits/totalShots*100)+'%':'--%';
  document.getElementById('s-streak').textContent=streak;
  if(ammo <= 0) reloadWeapon();
}

/* ═══════════════════════════════════════════════════════════
   MAIN LOOP
═══════════════════════════════════════════════════════════ */
const clock=new THREE.Clock();
const moveDir=new THREE.Vector3();
const PLAYER_Y_G = 1.7;
const PLAYER_Y_U = PLAYER_Y_G;  // no upper floor

function playerTargetY(px, pz, currentY){
  // Single-floor urban map — player always at ground level
  return PLAYER_Y_G;
}

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);
  const now=performance.now();
  updateFlashlightTargets();   // keep flashlight aimed where camera looks
  if(gamePaused){
    renderer.render(scene,camera);
    return;
  }
  const reloadAnim = isReloading ? Math.sin(Math.min(1, (performance.now() % RELOAD_TIME) / RELOAD_TIME) * Math.PI) : 0;
  const targetFov = isAiming ? ADS_FOV : BASE_FOV;
  if(Math.abs(camera.fov - targetFov) > 0.02){
    camera.fov += (targetFov - camera.fov) * Math.min(1, dt * 12);
    camera.updateProjectionMatrix();
  }

  /* ── Camera rotation ── */
  camera.quaternion.setFromEuler(new THREE.Euler(pitch,yaw,0,'YXZ'));

  /* ── Player movement ── */
  const spd = cfg.moveSpeed * 1.8;

  // Keyboard (WASD / arrows)
  let kx=0, kz=0;
  if(keys['KeyW']||keys['ArrowUp'])    kz=-1;
  if(keys['KeyS']||keys['ArrowDown'])  kz= 1;
  if(keys['KeyA']||keys['ArrowLeft'])  kx=-1;
  if(keys['KeyD']||keys['ArrowRight']) kx= 1;

  // Combine keyboard + touch joystick
  const inputX = moveVec.x + kx;
  const inputZ = moveVec.z + kz;
  const inputLen = Math.sqrt(inputX*inputX + inputZ*inputZ);

  if(inputLen > 0.01){
    const nx = inputX/Math.max(inputLen,1), nz = inputZ/Math.max(inputLen,1);
    // Move relative to yaw (camera horizontal direction)
    const fwd  = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
    const right = new THREE.Vector3( Math.cos(yaw), 0, -Math.sin(yaw));
    moveDir.set(0,0,0)
      .addScaledVector(fwd,  -nz)
      .addScaledVector(right, nx);
    moveDir.normalize();

    const newPos = camera.position.clone().addScaledVector(moveDir, spd*dt);
    newPos.y = playerTargetY(newPos.x, newPos.z, camera.position.y);

    // Resolve collisions
    resolveCollisions(newPos);
    camera.position.copy(newPos);
  }

  /* ── Mannequin AI: seek player + wall avoidance ── */

  const playerPos2 = new THREE.Vector2(camera.position.x, camera.position.z);
  // Pre-build flat AABB list once per frame for bot collision checks
  const botAABBs = collisionWalls.map(w=>({
    x0:w.x0-0.32, x1:w.x1+0.32, z0:w.z0-0.32, z1:w.z1+0.32
  }));
  const MWALL = WALL_LIMIT - 0.35;

  // Helper: does a 2D segment (sx,sz)→(ex,ez) intersect any wall AABB?
  function segHitsWall(sx,sz,ex,ez){
    const dx=ex-sx, dz=ez-sz;
    const len=Math.sqrt(dx*dx+dz*dz); if(len<0.001)return false;
    const nx=dx/len, nz=dz/len;
    for(const w of botAABBs){
      // Slab test X
      let tmin=-Infinity, tmax=Infinity;
      if(Math.abs(nx)>1e-6){
        const t1=(w.x0-sx)/nx, t2=(w.x1-sx)/nx;
        tmin=Math.max(tmin,Math.min(t1,t2)); tmax=Math.min(tmax,Math.max(t1,t2));
      } else if(sx<w.x0||sx>w.x1){continue;}
      if(Math.abs(nz)>1e-6){
        const t1=(w.z0-sz)/nz, t2=(w.z1-sz)/nz;
        tmin=Math.max(tmin,Math.min(t1,t2)); tmax=Math.min(tmax,Math.max(t1,t2));
      } else if(sz<w.z0||sz>w.z1){continue;}
      if(tmax>=tmin && tmin>=0 && tmin<=len) return true;
    }
    // Outer walls
    if(ex> MWALL||ex<-MWALL||ez> MWALL||ez<-MWALL) return true;
    return false;
  }

  for(let i=0;i<mannequins.length;i++){
    const mn=mannequins[i]; if(!mn||mn.dying)continue;
    const pos=mn.group.position;

    // ── Steer toward player ──
    const toBotX = playerPos2.x - pos.x;
    const toBotZ = playerPos2.y - pos.z;
    const distToPlayer = Math.sqrt(toBotX*toBotX + toBotZ*toBotZ);
    let desiredX = toBotX, desiredZ = toBotZ;

    if(distToPlayer > 0.01){
      desiredX /= distToPlayer;
      desiredZ /= distToPlayer;
    }

    // ── Wall avoidance: probe 5 directions, pick best unobstructed ──
    const PROBE = 1.8;  // look-ahead distance
    const directBlocked = segHitsWall(pos.x, pos.z,
      pos.x + desiredX*PROBE, pos.z + desiredZ*PROBE);

    if(directBlocked){
      // Sample candidate angles: slight deflections first, then wider
      const ANGLES = [0.45, -0.45, 0.9, -0.9, 1.35, -1.35, Math.PI*0.6, -Math.PI*0.6];
      let found = false;
      const baseAngle = Math.atan2(desiredX, desiredZ);
      for(const da of ANGLES){
        const a = baseAngle + da;
        const cx = Math.sin(a), cz = Math.cos(a);
        if(!segHitsWall(pos.x, pos.z, pos.x+cx*PROBE, pos.z+cz*PROBE)){
          desiredX = cx; desiredZ = cz;
          found = true; break;
        }
      }
      // If all blocked, slide along the wall by choosing the least-obstructed
      if(!found){
        // pick perpendicular left or right of current velocity
        const currA = Math.atan2(mn.vel.x, mn.vel.z);
        const aL = currA + Math.PI/2, aR = currA - Math.PI/2;
        const lx=Math.sin(aL), lz=Math.cos(aL);
        const rx=Math.sin(aR), rz=Math.cos(aR);
        if(!segHitsWall(pos.x,pos.z,pos.x+lx*0.8,pos.z+lz*0.8)){
          desiredX=lx; desiredZ=lz;
        } else if(!segHitsWall(pos.x,pos.z,pos.x+rx*0.8,pos.z+rz*0.8)){
          desiredX=rx; desiredZ=rz;
        }
      }
    }

    // Smooth steering (lerp velocity toward desired direction)
    const STEER = 5.0;  // turn speed
    mn.vel.x += (desiredX * BOT_SPEED - mn.vel.x) * Math.min(1, STEER * dt);
    mn.vel.z += (desiredZ * BOT_SPEED - mn.vel.z) * Math.min(1, STEER * dt);
    // Clamp to BOT_SPEED
    const vlen = Math.sqrt(mn.vel.x*mn.vel.x + mn.vel.z*mn.vel.z);
    if(vlen > BOT_SPEED){ mn.vel.x *= BOT_SPEED/vlen; mn.vel.z *= BOT_SPEED/vlen; }

    // ── Move ──
    pos.x += mn.vel.x * dt;
    pos.z += mn.vel.z * dt;

    // ── Hard push-out from walls & outer boundary ──
    if(pos.x > MWALL){ pos.x= MWALL; mn.vel.x=-Math.abs(mn.vel.x); }
    if(pos.x <-MWALL){ pos.x=-MWALL; mn.vel.x= Math.abs(mn.vel.x); }
    if(pos.z > MWALL){ pos.z= MWALL; mn.vel.z=-Math.abs(mn.vel.z); }
    if(pos.z <-MWALL){ pos.z=-MWALL; mn.vel.z= Math.abs(mn.vel.z); }

    for(const w of collisionWalls){
      const wx=(w.x0+w.x1)/2, wz=(w.z0+w.z1)/2;
      const hw=(w.x1-w.x0)/2+0.32, hd=(w.z1-w.z0)/2+0.32;
      const dx=pos.x-wx, dz=pos.z-wz;
      if(Math.abs(dx)<hw && Math.abs(dz)<hd){
        const penX=hw-Math.abs(dx), penZ=hd-Math.abs(dz);
        if(penX<penZ){pos.x=wx+Math.sign(dx)*hw; mn.vel.x*=-0.3;}
        else         {pos.z=wz+Math.sign(dz)*hd; mn.vel.z*=-0.3;}
      }
    }

    // Face movement direction
    const speed2d = Math.sqrt(mn.vel.x*mn.vel.x + mn.vel.z*mn.vel.z);
    if(speed2d > 0.05) mn.group.rotation.y = Math.atan2(-mn.vel.x, -mn.vel.z);

    // ── Zombie walk animation ── (skip if dying)
    if(mn.dying) continue;
    // Slow shamble: phase advances at ~half the speed of a run
    mn.animPhase += dt * speed2d * 2.1;
    const t = mn.animPhase;

    // Each zombie gets a persistent limp side stored at spawn
    // We use animPhase seed stored as mn.limpSide (1 = left limps, -1 = right limps)
    const limp = mn.limpSide || 1;

    // ── LEGS: asymmetric limp gait ──
    // Good leg: strong forward pendulum swing
    // Bad leg:  drags behind — barely swings forward, heavy knee lock
    const goodSwing =  Math.sin(t) * 0.70;          // bigger normal step
    const badSwing  =  Math.sin(t + 0.55) * 0.18    // tiny drag step
                    - 0.12;                           // permanent slight backward bias (dragging)

    mn.legL.rotation.x = limp ===  1 ? badSwing  :  goodSwing;
    mn.legR.rotation.x = limp === -1 ? badSwing  : -goodSwing;

    // Knee bends
    // Good knee: big natural bend on forward swing
    // Bad knee:  almost rigid — barely flexes, slight permanent bend
    mn.kneeL.rotation.x = limp ===  1
      ? 0.08 + Math.max(0, Math.sin(t + 0.55)) * 0.15   // stiff, almost locked
      : Math.max(0,  Math.sin(t)) * 1.05 + 0.05;         // exaggerated healthy bend
    mn.kneeR.rotation.x = limp === -1
      ? 0.08 + Math.max(0, Math.sin(t + 0.55)) * 0.15
      : Math.max(0, -Math.sin(t)) * 1.05 + 0.05;

    // Hip lean: torso drops toward the bad leg side each drag step
    const limpLurch = limp * Math.max(0, -Math.sin(t + 0.3)) * 0.18;

    // ── ARMS: zombie outstretched forward ──
    // Upper arm pivot is at shoulder. Geometry hangs DOWN in local space.
    // Positive rotation.x tilts the arm FORWARD (zombie reach).
    // rotation.x = 0  → arm pointing straight down
    // rotation.x = +PI/2 → arm pointing straight forward (horizontal)
    // rotation.x = +PI   → arm pointing straight up
    const armSway = Math.sin(t * 0.9) * 0.10;   // slow lateral sway

    // Left arm: raised ~95° forward (slightly above horizontal) + sway
    mn.armL.rotation.x = 1.65 + armSway;
    // Right arm: slightly different angle for asymmetry
    mn.armR.rotation.x = 1.55 - armSway * 0.8;

    // Spread outward (Z) — arms not perfectly parallel
    mn.armL.rotation.z =  0.14 + Math.sin(t * 0.65) * 0.05;
    mn.armR.rotation.z = -0.18 - Math.sin(t * 0.65) * 0.05;

    // Elbows: slightly bent downward (forearm droops a little)
    // positive x = forearm tips forward/down relative to upper arm
    mn.elbowL.rotation.x = -0.30 + Math.sin(t * 0.8) * 0.10;
    mn.elbowR.rotation.x = -0.25 - Math.sin(t * 0.8) * 0.10;

    // ── TORSO: hunched forward + heavy lateral lurch ──
    mn.torso.rotation.x =  0.28;                          // permanent forward hunch
    mn.torso.rotation.z =  limpLurch + Math.sin(t * 0.95) * 0.14;  // lurch + sway
    mn.group.rotation.x =  0;                             // group stays upright

    // ── HEAD: lolling to one side, nodding slightly ──
    mn.head.rotation.z  =  limp * 0.18 + Math.sin(t * 0.6) * 0.07;
    mn.head.rotation.x  =  0.12 + Math.sin(t * 1.1) * 0.05;   // gentle nod

    // ── BODY: irregular up-down drag (limp causes uneven step) ──
    // Good step: short bounce. Bad step: almost no lift.
    // Good step = short hop, bad step = almost no lift (foot drags)
    const goodBounce = Math.max(0,  Math.sin(t * 2)) * 0.038;
    const badBounce  = Math.max(0, -Math.sin(t * 2)) * 0.006;
    const bounce = limp === 1
      ? goodBounce * (limp < 0 ? 1 : 0) + badBounce  // left limps → R step hops, L drags
      : goodBounce;
    mn.group.position.y = MANI_Y + Math.max(0, Math.sin(t * 2)) * 0.032
                        + Math.max(0, -Math.sin(t * 2)) * 0.006 * Math.abs(limp);

    // ── Bot ↔ Player contact damage ──
    if(!playerDead && !mn.dying){
      const dx = camera.position.x - mn.group.position.x;
      const dz = camera.position.z - mn.group.position.z;
      const dist = Math.sqrt(dx*dx + dz*dz);
      if(dist < BOT_CONTACT_DIST){
        const nowSec = now * 0.001;
        if(nowSec - mn.lastDmgTime >= BOT_DMG_COOLDOWN){
          mn.lastDmgTime = nowSec;
          damagePlayer(BOT_CONTACT_DMG);
          const el=document.createElement('div');
          el.className='spop';
          el.style.color='#ff3333';
          el.style.textShadow='0 0 10px #ff0000';
          el.innerHTML='-'+BOT_CONTACT_DMG+' HP';
          el.style.left=(window.innerWidth/2-30)+'px';
          el.style.top=(window.innerHeight/2+30)+'px';
          document.body.appendChild(el);
          setTimeout(()=>el.remove(),800);
        }
      }
    }
  }

  /* ══════════════════════════════════════════════════════
     DEATH ANIMATIONS  —  6 ragdoll variants
     Geometry reference (group-local, y=0 = ankles):
       feet    y = 0.00
       hips    y = 0.89
       torso   y = 1.24
       head    y = 1.73
       total   ≈ 1.88
     BODY_H = 1.0  (half height, pivot for rotation compensation)

     HEAD SHOTS  (3 variants):
       H1 — collapses straight forward, face-down
       H2 — snaps back, falls backward
       H3 — violent spin+fall to the side

     BODY SHOTS  (3 variants):
       B1 — trips forward onto knees then face
       B2 — crumples sideways, one knee buckles first
       B3 — spins half-turn and drops backward
     ══════════════════════════════════════════════════════ */
  {
  const BODY_H = 1.0; // height of centre-of-mass above pivot (ankles)
  const FADE_DUR = 0.55;

  // Helper: set opacity on all meshes in group
  function setOpacity(mn, v){
    mn.group.traverse(o=>{
      if(o.isMesh && o.material){
        o.material.transparent = v < 1;
        o.material.opacity = v;
      }
    });
  }

  // Helper: smooth interpolations
  function c01(v){ return Math.max(0,Math.min(1,v)); }
  function eIn(f){ return f*f*f; }
  function eOut(f){ return 1-Math.pow(1-f,3); }
  function eIO(f){ return f<.5?4*f*f*f:1-Math.pow(-2*f+2,3)/2; }

  // Y correction when rotating group around X by angle θ:
  // The ankles (pivot) stay fixed; the CoM at y=BODY_H traces an arc.
  // To keep feet on floor: group.position.y = -BODY_H*(1-cos(θ))
  // BUT the skeleton has feet at y=0, so when the body rotates forward
  // the back-most point (feet) lifts unless we shift pivot down.
  // Simpler approach: we never rotate the group itself —
  // instead we rotate individual body parts and compute group.position.y
  // using a simple ground-contact rule.
  // For whole-body fall we DO rotate the group but correct y:
  //   correct_y = MANI_Y - BODY_H*(1 - Math.cos(θ))

  for(let i=mannequins.length-1;i>=0;i--){
    const mn=mannequins[i]; if(!mn||!mn.dying)continue;
    mn.deathTimer += dt;
    const tp = mn.deathTimer;
    const ld = mn.limpSide||1;
    const variant = mn.deathVariant||0;

    /* ─────────────────────────────────────────────────────
       HEAD SHOT variants
    ───────────────────────────────────────────────────── */
    if(mn.deathType==='head'){
      const FALL = variant===0 ? 0.65 : variant===1 ? 0.70 : 0.55;
      const GROUND = FALL + 5.0;
      const TOTAL  = GROUND + FADE_DUR;

      if(tp < TOTAL){
        if(tp >= GROUND){
          // Fade
          setOpacity(mn, 1 - c01((tp-GROUND)/FADE_DUR));
        } else if(tp >= FALL){
          // Frozen on ground — nothing to do, pose set at end of fall
        } else {
          // ── Fall phase ──
          const f = c01(tp/FALL);

          if(variant===0){
            // H1: STRAIGHT FORWARD COLLAPSE
            // Jerk phase (0→0.15): head snaps back, knees buckle
            // Fall phase (0.15→1): whole body pivots forward
            const JERK_END = 0.15/FALL;
            if(f < JERK_END){
              const jf = f/JERK_END;
              mn.head.rotation.x  = -jf*1.1;
              mn.head.rotation.z  =  jf*0.15;
              mn.torso.rotation.x =  jf*0.18;
              mn.kneeL.rotation.x =  jf*0.30;
              mn.kneeR.rotation.x =  jf*0.25;
              mn.group.position.y =  MANI_Y;
            } else {
              const ff  = eIn(c01((f-JERK_END)/(1-JERK_END)));
              const ang = ff * Math.PI*0.50;
              mn.group.rotation.x     =  ang;
              mn.group.position.y     =  MANI_Y - BODY_H*(1-Math.cos(ang));
              // Arms spread during fall
              mn.armL.rotation.x      =  0.45 + ff*0.35;
              mn.armR.rotation.x      =  0.45 + ff*0.25;
              mn.armL.rotation.z      =  0.14 + ff*1.05;
              mn.armR.rotation.z      = -0.18 - ff*0.95;
              mn.elbowL.rotation.x    = -0.30 - ff*0.20;
              mn.elbowR.rotation.x    = -0.25 - ff*0.15;
              mn.legL.rotation.x      = -ff*0.30;
              mn.legR.rotation.x      = -ff*0.25;
              mn.head.rotation.x      = -1.1 + ff*0.75; // head swings forward
            }

          } else if(variant===1){
            // H2: SNAPS BACKWARD — falls onto back
            const JERK_END = 0.12/FALL;
            if(f < JERK_END){
              const jf = f/JERK_END;
              mn.head.rotation.x  =  jf*0.8;   // head forward first (surprise)
              mn.armL.rotation.x  =  1.65;
              mn.armR.rotation.x  =  1.55;
              mn.group.position.y =  MANI_Y + jf*0.06;
            } else {
              const ff  = eIn(c01((f-JERK_END)/(1-JERK_END)));
              const ang = -ff * Math.PI*0.50; // negative = backward
              mn.group.rotation.x     =  ang;
              mn.group.position.y     =  MANI_Y - BODY_H*(1-Math.cos(ang));
              mn.armL.rotation.x      =  1.65 - ff*2.20; // arms fly backward
              mn.armR.rotation.x      =  1.55 - ff*2.00;
              mn.armL.rotation.z      =  0.14 + ff*0.80;
              mn.armR.rotation.z      = -0.18 - ff*0.70;
              mn.legL.rotation.x      =  ff*0.40;
              mn.legR.rotation.x      =  ff*0.35;
              mn.head.rotation.x      =  0.8  + ff*0.50;
            }

          } else {
            // H3: SPIN + SIDE DROP — quarter spin then falls sideways
            const SPIN_END = 0.30/FALL;
            if(f < SPIN_END){
              const sf = eOut(f/SPIN_END);
              mn.group.rotation.y   +=  sf * dt * 6.0;  // fast spin
              mn.armL.rotation.z    =  0.14 + sf*1.20;
              mn.armR.rotation.z    = -0.18 - sf*1.00;
              mn.armL.rotation.x    =  1.65 - sf*0.60;
              mn.armR.rotation.x    =  1.55 - sf*0.50;
              mn.group.position.y   =  MANI_Y + sf*0.08;
            } else {
              const ff  = eIO(c01((f-SPIN_END)/(1-SPIN_END)));
              const ang = ff * Math.PI*0.50;
              mn.group.rotation.z   = -ld * ang;
              mn.group.position.y   =  MANI_Y - BODY_H*(1-Math.cos(ang));
              mn.armL.rotation.z    =  1.34 + ff*0.25;
              mn.armR.rotation.z    = -1.18 - ff*0.20;
              mn.legL.rotation.x    =  ff*(ld<0?0.35:-0.10);
              mn.legR.rotation.x    =  ff*(ld>0?0.35:-0.10);
            }
          }

          // Freeze pose at end of fall
          if(f >= 0.999){
            mn.deathFrozen = true;
          }
        }

      } else {
        // Respawn
        setOpacity(mn,1);
        mn.group.rotation.set(0,mn.group.rotation.y,0);
        spawnMannequin(i);
      }

    /* ─────────────────────────────────────────────────────
       BODY SHOT variants
    ───────────────────────────────────────────────────── */
    } else {
      const FALL = variant===0 ? 1.0 : variant===1 ? 0.90 : 0.80;
      const GROUND = FALL + 5.0;
      const TOTAL  = GROUND + FADE_DUR;

      if(tp < TOTAL){
        if(tp >= GROUND){
          setOpacity(mn, 1 - c01((tp-GROUND)/FADE_DUR));
        } else if(!mn.deathFrozen){

          const f = c01(tp/FALL);

          if(variant===0){
            // B1: TRIP FORWARD — knees buckle, then falls face-down
            const KNEES_END = 0.35/FALL;
            const FALL2_END = 1.0;
            if(f < KNEES_END){
              // Both knees buckle, torso pitches forward
              const kf = eOut(f/KNEES_END);
              mn.torso.rotation.x  =  0.28 + kf*0.55;
              mn.legL.rotation.x   =  kf*0.30;
              mn.legR.rotation.x   =  kf*0.25;
              mn.kneeL.rotation.x  =  kf*1.10;
              mn.kneeR.rotation.x  =  kf*0.95;
              mn.armL.rotation.x   =  1.65 - kf*0.40;
              mn.armR.rotation.x   =  1.55 - kf*0.35;
              mn.group.position.y  =  MANI_Y - kf*0.28; // sinks as knees bend
            } else {
              const ff  = eIn(c01((f-KNEES_END)/(FALL2_END-KNEES_END)));
              const ang = ff * Math.PI*0.45;
              mn.group.rotation.x  =  ang;
              mn.group.position.y  =  MANI_Y - 0.28 - (BODY_H-0.28)*(1-Math.cos(ang));
              mn.kneeL.rotation.x  =  1.10 - ff*0.80;
              mn.kneeR.rotation.x  =  0.95 - ff*0.70;
              mn.armL.rotation.x   =  1.25 + ff*0.15;
              mn.armR.rotation.x   =  1.20 + ff*0.10;
              mn.armL.rotation.z   =  0.14 + ff*0.95;
              mn.armR.rotation.z   = -0.18 - ff*0.85;
              mn.head.rotation.x   = -ff*0.30;
            }

          } else if(variant===1){
            // B2: CRUMPLE SIDEWAYS — one knee first, then body rolls
            const KNEE1_END = 0.25/FALL;
            if(f < KNEE1_END){
              const kf = eOut(f/KNEE1_END);
              // The limping knee gives out first
              if(ld > 0){
                mn.kneeL.rotation.x = kf*1.25;
                mn.legL.rotation.x  = kf*0.20;
              } else {
                mn.kneeR.rotation.x = kf*1.25;
                mn.legR.rotation.x  = kf*0.20;
              }
              mn.torso.rotation.z =  ld * kf * 0.55;
              mn.torso.rotation.x =  0.28 + kf*0.30;
              mn.group.position.y =  MANI_Y - kf*0.18;
              mn.armL.rotation.z  =  0.14 + kf*1.00;
              mn.armR.rotation.z  = -0.18 - kf*0.70;
            } else {
              const ff  = eIO(c01((f-KNEE1_END)/(1-KNEE1_END)));
              const ang = ff * Math.PI*0.50;
              mn.group.rotation.z = -ld * ang;
              mn.group.rotation.x =  ff * 0.18;
              mn.group.position.y = MANI_Y - 0.18 - (BODY_H-0.18)*(1-Math.cos(ang));
              mn.torso.rotation.z = ld*0.55 - ff*ld*0.30;
              mn.armL.rotation.z  = 1.14 + ff*0.30;
              mn.armR.rotation.z  = -0.88 - ff*0.25;
              mn.kneeL.rotation.x = ld>0 ? 1.25-ff*0.80 : ff*0.15;
              mn.kneeR.rotation.x = ld<0 ? 1.25-ff*0.80 : ff*0.15;
              mn.legL.rotation.x  = 0.20 + ff*(ld>0 ? 0.15:-0.10);
              mn.legR.rotation.x  = 0.20 + ff*(ld<0 ? 0.15:-0.10);
            }

          } else {
            // B3: HALF-SPIN BACKWARD DROP
            const SPIN_END = 0.40/FALL;
            if(f < SPIN_END){
              const sf = eOut(f/SPIN_END);
              mn.group.rotation.y  +=  sf * dt * 4.5 * ld;
              mn.torso.rotation.x   =  0.28 + sf*0.40;
              mn.armL.rotation.x    =  1.65 - sf*0.80;
              mn.armR.rotation.x    =  1.55 - sf*0.60;
              mn.armL.rotation.z    =  0.14 + sf*1.10;
              mn.armR.rotation.z    = -0.18 - sf*0.90;
              mn.group.position.y   =  MANI_Y + sf*0.05;
            } else {
              const ff  = eIn(c01((f-SPIN_END)/(1-SPIN_END)));
              const ang = -ff * Math.PI*0.50; // backward
              mn.group.rotation.x  =  ang;
              mn.group.position.y  =  MANI_Y - BODY_H*(1-Math.cos(ang));
              mn.armL.rotation.x   =  0.85 - ff*2.10;
              mn.armR.rotation.x   =  0.95 - ff*1.90;
              mn.legL.rotation.x   =  ff*0.45;
              mn.legR.rotation.x   =  ff*0.40;
              mn.head.rotation.x   =  ff*0.45;
            }
          }

          if(f >= 0.999) mn.deathFrozen = true;
        }

      } else {
        setOpacity(mn,1);
        mn.group.rotation.set(0,mn.group.rotation.y,0);
        spawnMannequin(i);
      }
    }
  }
  }
  /* ── Bot ↔ Bot separation (circle collisions) ── */
  for(let i=0;i<mannequins.length;i++){
    const a=mannequins[i]; if(!a||a.dying)continue;
    for(let j=i+1;j<mannequins.length;j++){
      const b=mannequins[j]; if(!b||b.dying)continue;
      const dx=a.group.position.x-b.group.position.x;
      const dz=a.group.position.z-b.group.position.z;
      const dist=Math.sqrt(dx*dx+dz*dz);
      const minDist=BOT_RADIUS*2;
      if(dist<minDist && dist>0.001){
        const push=(minDist-dist)*0.5;
        const nx=dx/dist, nz=dz/dist;
        a.group.position.x+=nx*push; a.group.position.z+=nz*push;
        b.group.position.x-=nx*push; b.group.position.z-=nz*push;
        // Cancel velocity component into each other
        const relX=a.vel.x-b.vel.x, relZ=a.vel.z-b.vel.z;
        const dot=relX*nx+relZ*nz;
        if(dot<0){
          a.vel.x-=dot*nx*0.6; a.vel.z-=dot*nz*0.6;
          b.vel.x+=dot*nx*0.6; b.vel.z+=dot*nz*0.6;
        }
      }
    }
  }

  /* ── Bot ↔ Player separation (push player away) ── */
  if(!playerDead){
    for(let i=0;i<mannequins.length;i++){
      const mn=mannequins[i]; if(!mn||mn.dying)continue;
      const dx=camera.position.x-mn.group.position.x;
      const dz=camera.position.z-mn.group.position.z;
      const dist=Math.sqrt(dx*dx+dz*dz);
      const minDist=BOT_RADIUS+PLAYER_RADIUS;
      if(dist<minDist && dist>0.001){
        const push=minDist-dist;
        const nx=dx/dist, nz=dz/dist;
        // Push player out (bot is heavier — only player moves)
        camera.position.x+=nx*push;
        camera.position.z+=nz*push;
        // Also slow bot velocity component toward player
        const dot=mn.vel.x*(-nx)+mn.vel.z*(-nz);
        if(dot>0){ mn.vel.x+=nx*dot*0.4; mn.vel.z+=nz*dot*0.4; }
      }
    }
  }

  /* ── Player HP regeneration ── */
  if(!playerDead && playerHP < MAX_HP){
    const nowSec = now * 0.001;
    if(nowSec - lastDamageTime >= HP_REGEN_DELAY){
      playerHP = Math.min(MAX_HP, playerHP + HP_REGEN_RATE * dt);
      updateHP();
    }
  }

  /* ── Gun recoil animation ── */
  recoilKick = recoilKick * Math.exp(-RECOIL_DECAY * dt);
  recoilRot  = recoilRot  * Math.exp(-RECOIL_DECAY * dt);
  // Base resting position + recoil offset
  gunGroup.position.set(0, -reloadAnim * 0.08, recoilKick + reloadAnim * 0.05);
  gunGroup.rotation.set(recoilRot + reloadAnim * 0.85, 0, -0.025 + reloadAnim * 0.22);

  /* ── Bullets ── */
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    const vel=b.userData.vel;
    const step=vel.clone().multiplyScalar(dt);
    const nextPos=b.position.clone().add(step);

    // Check bullet against collision walls (AABB sweep)
    let hit=false;
    for(const w of collisionWalls){
      // Expand wall by bullet radius (tiny — treat as point)
      const wx=(w.x0+w.x1)/2, wz=(w.z0+w.z1)/2;
      const hw=(w.x1-w.x0)/2+0.05, hd=(w.z1-w.z0)/2+0.05;
      // Check if next position is inside wall slab
      if(nextPos.x>w.x0-0.05&&nextPos.x<w.x1+0.05&&
         nextPos.z>w.z0-0.05&&nextPos.z<w.z1+0.05&&
         nextPos.y>0&&nextPos.y<CEIL){
        hit=true; break;
      }
      // Also check crossing: does segment from current to next cross the wall?
      // X-normal walls (thin in X)
      if((w.x1-w.x0)<(w.z1-w.z0)){
        const cx=wx;
        if(Math.min(b.position.x,nextPos.x)<cx+hw && Math.max(b.position.x,nextPos.x)>cx-hw){
          const t2=hw>0?(cx-b.position.x)/step.x:Infinity;
          if(t2>=0&&t2<=1){
            const iz=b.position.z+step.z*t2;
            if(iz>w.z0&&iz<w.z1&&b.position.y>0&&b.position.y<CEIL){hit=true;break;}
          }
        }
      } else {
        // Z-normal walls
        const cz=wz;
        if(Math.min(b.position.z,nextPos.z)<cz+hd && Math.max(b.position.z,nextPos.z)>cz-hd){
          const t2=hd>0?(cz-b.position.z)/step.z:Infinity;
          if(t2>=0&&t2<=1){
            const ix=b.position.x+step.x*t2;
            if(ix>w.x0&&ix<w.x1&&b.position.y>0&&b.position.y<CEIL){hit=true;break;}
          }
        }
      }
    }
    // Outer boundary check
    if(!hit && (nextPos.x>WALL_LIMIT||nextPos.x<-WALL_LIMIT||nextPos.z>WALL_LIMIT||nextPos.z<-WALL_LIMIT)) hit=true;

    if(hit){
      scene.remove(b); bullets.splice(i,1);
    } else {
      b.position.copy(nextPos);
      b.userData.life-=dt;
      if(b.userData.life<=0){scene.remove(b);bullets.splice(i,1);}
    }
  }

  renderer.render(scene,camera);
}
animate();

function handleResize(){
  const w=window.innerWidth,h=window.innerHeight;
  camera.aspect=w/h;camera.updateProjectionMatrix();
  applyRenderQuality();
  renderer.setSize(w,h);setZones();
  // Clamp button position to new screen size
  btnCfg.fire.x=Math.min(btnCfg.fire.x,w-btnCfg.fire.size);
  btnCfg.fire.y=Math.min(btnCfg.fire.y,h-btnCfg.fire.size);
  btnCfg.aim.x=Math.min(btnCfg.aim.x,w-btnCfg.aim.size);
  btnCfg.aim.y=Math.min(btnCfg.aim.y,h-btnCfg.aim.size);
  applyBtnCfg();
}
window.addEventListener('resize',handleResize);
if(window.visualViewport) window.visualViewport.addEventListener('resize',handleResize);
window.addEventListener('orientationchange',()=>setTimeout(handleResize,250));
document.addEventListener('contextmenu',e=>e.preventDefault());
</script>
</body>
</html>
